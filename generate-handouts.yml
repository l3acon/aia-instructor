---
# Usage:
#   ansible-playbook generate-handouts.yml \
#     -e workshop_url=https://demo.redhat.com/workshop/... \
#     -e workshop_password=...
#
# Optional overrides (skip cluster discovery when both are set):
#     -e ctfd_url=https://short.example/ctf \
#     -e gitea_url=https://short.example/git
#
# Requires: player.creds (generated by deploy.yml), pdflatex
# Requires (unless ctfd_url + gitea_url are both provided): rosa.creds

- name: Generate player credential handouts
  hosts: localhost
  gather_facts: false
  connection: local

  vars_files:
    - roles/ctfd/defaults/main.yml
    - roles/ctfd/vars/main.yml

  pre_tasks:
    - name: Verify workshop_url and workshop_password are provided
      ansible.builtin.assert:
        that:
          - workshop_url is defined and workshop_url | length > 0
          - workshop_password is defined and workshop_password | length > 0
        fail_msg: >-
          workshop_url and workshop_password are required:
          ansible-playbook generate-handouts.yml -e workshop_url=https://... -e workshop_password=...

    - name: Verify player.creds exists
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/player.creds"
      register: _player_creds_file
      failed_when: not _player_creds_file.stat.exists

    - name: Load player credentials
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/player.creds"
        name: _cached_creds

    - name: Set player passwords and tokens
      ansible.builtin.set_fact:
        player_passwords: "{{ _cached_creds.players }}"
        player_tokens: "{{ _cached_creds.tokens | default({}) }}"

    - name: Discover service URLs from cluster
      when: ctfd_url is not defined or gitea_url is not defined
      block:
        - name: Load ROSA resource claim
          ansible.builtin.include_vars:
            file: rosa.creds
            name: rosa_claim

        - name: Set ROSA credentials from provision data
          ansible.builtin.set_fact:
            rosa: "{{ rosa_claim.status.summary.provision_data }}"

        - name: Login to OpenShift
          ansible.builtin.command:
            argv:
              - oc
              - login
              - "{{ rosa.rosa_openshift_api_url }}"
              - "--username={{ rosa.rosa_openshift_admin_user }}"
              - "--password={{ rosa.rosa_openshift_admin_password }}"
              - --insecure-skip-tls-verify=true
          changed_when: false

        - name: Get cluster ingress config
          kubernetes.core.k8s_info:
            api_version: config.openshift.io/v1
            kind: Ingress
            name: cluster
          register: _ingress_config

        - name: Set service URLs from cluster domain
          ansible.builtin.set_fact:
            ctfd_url: "https://{{ ctfd_route_name }}-{{ project_name }}.{{ _ingress_config.resources[0].spec.domain }}"
            gitea_url: "https://gitea-{{ gitea_namespace }}.{{ _ingress_config.resources[0].spec.domain }}"

  tasks:
    - name: Generate credentials CSV
      ansible.builtin.copy:
        content: |
          username,password,token
          {% for name, password in player_passwords.items() | sort %}
          {{ name }},{{ password }},{{ player_tokens[name] | default('') }}
          {% endfor %}
        dest: "{{ playbook_dir }}/handouts/credentials.csv"
        mode: "0600"

    - name: Template LaTeX handout
      ansible.builtin.template:
        src: "{{ playbook_dir }}/handouts/credential-handouts.tex.j2"
        dest: "{{ playbook_dir }}/handouts/credential-handouts.tex"

    - name: Generate PDF with pdflatex
      ansible.builtin.command:
        cmd: pdflatex -interaction=nonstopmode credential-handouts.tex
        chdir: "{{ playbook_dir }}/handouts"
      changed_when: true

    - name: Clean up LaTeX intermediate files
      ansible.builtin.file:
        path: "{{ playbook_dir }}/handouts/{{ item }}"
        state: absent
      loop:
        - credential-handouts.aux
        - credential-handouts.log
        - credential-handouts.out
        - credentials.csv
        - credential-handouts.tex

    - name: Report handout location
      ansible.builtin.debug:
        msg: >-
          Handouts generated: handouts/credential-handouts.pdf
          ({{ player_passwords | length }} players)
