---
- name: Generate access handouts for the personal training board
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - ansible.builtin.import_tasks: tasks/discover.yml

    - name: Create a private handouts directory
      ansible.builtin.file:
        path: "{{ playbook_dir }}/handouts/generated"
        state: directory
        mode: '0700'

    - name: Generate service access handout
      ansible.builtin.copy:
        dest: "{{ playbook_dir }}/handouts/generated/access.md"
        mode: '0600'
        content: |
          # Ansible Island Adventure — {{ _aia_identity.stdout }}

          | Service | URL | Username |
          | --- | --- | --- |
          | CTFd | https://{{ _aia_route.spec.host }} | lab-user |
          | Gitea | https://gitea.{{ _aia_route.spec.host.split('.', 1)[1] }} | {{ _aia_identity.stdout }} |
          | AAP | https://aap-aap.{{ _aia_route.spec.host.split('.', 1)[1] }} | {{ _aia_identity.stdout }} |
          | Dev Spaces | https://devspaces.{{ _aia_route.spec.host.split('.', 1)[1] }} | {{ _aia_identity.stdout }} |

          Use the provisioned lab password supplied privately by your organizer.
          This handout lists existing training accounts; it does not create accounts
          or recover/reset their passwords. Keep CTFd administrator access and the instructor answer files
          with the facilitator.

    - name: Report generated handout
      ansible.builtin.debug:
        msg: handouts/generated/access.md — print from Markdown preview or distribute privately.
