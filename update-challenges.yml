---
- name: Update personal CTFd challenges while preserving progress
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - roles/ctfd/vars/flags.yml
    - roles/ctfd/vars/challenges.yml
    - roles/ctfd/vars/challenges_advanced.yml
  vars:
    _aia_mode: update
  tasks:
    - ansible.builtin.import_tasks: tasks/content.yml
