---
# Destructive: clears challenge progress on your personal board, preserving accounts.
- name: Reset the instructor's personal CTFd board
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - roles/ctfd/vars/flags.yml
    - roles/ctfd/vars/challenges.yml
    - roles/ctfd/vars/challenges_advanced.yml
  vars:
    _aia_mode: reset
  tasks:
    - ansible.builtin.import_tasks: tasks/content.yml
