---
- name: Display player credentials
  ansible.builtin.debug:
    msg: |-
      CTFd URL: https://{{ ctfd_route_name }}-{{ project_name }}.{{ cluster_apps_domain }}
      Gitea URL: https://gitea-{{ gitea_namespace }}.{{ cluster_apps_domain }}
      {% for name, password in player_passwords.items() | sort %}
      {{ name }}: {{ password }}
      {% endfor %}
      Credentials cached in {{ playbook_dir }}/player.creds
