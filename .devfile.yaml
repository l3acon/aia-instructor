schemaVersion: 2.2.0
metadata:
  name: aia-instructor
  displayName: AIA Instructor — Ansible Island Adventure
  description: Instructor toolkit for managing CTFd challenges with Ansible dev tools
attributes:
  che-code.eclipse.org/vscode-preferences:
    security.workspace.trust.enabled: false

components:
  - name: ansible-tools
    container:
      # Public Dev Spaces runtime with the Ansible Development Tools bundle.
      image: ghcr.io/ansible/ansible-devspaces@sha256:12db1db91682f48b9a853d255a7294e3b903d85a4c34ddc6e47e42a9bcc21ecf
      memoryLimit: 4Gi
      memoryRequest: 1Gi
      cpuLimit: 2000m
      cpuRequest: 500m
      mountSources: true
      sourceMapping: /projects
      env:
        - name: ANSIBLE_VAULT_PASSWORD_FILE
          value: /projects/aia-instructor/.vault-password

commands:
  - id: setup-ansible-collections
    exec:
      component: ansible-tools
      commandLine: >-
        ansible-galaxy collection install
        -p /home/user/.ansible/collections
        kubernetes.core:6.2.0 community.general:11.4.0 ansible.posix:2.1.0
      workingDir: /projects/aia-instructor
      label: "Install instructor playbook collections"
      group:
        kind: build
        isDefault: false

  - id: view-flags
    exec:
      component: ansible-tools
      commandLine: >-
        ansible-vault view roles/ctfd/vars/flags.yml
      workingDir: /projects/aia-instructor
      label: "View CTFd flags (requires vault password)"
      group:
        kind: run
        isDefault: false

  - id: edit-flags
    exec:
      component: ansible-tools
      commandLine: >-
        ansible-vault edit roles/ctfd/vars/flags.yml
      workingDir: /projects/aia-instructor
      label: "Edit CTFd flags"
      group:
        kind: run
        isDefault: false

  - id: deploy-challenges
    exec:
      component: ansible-tools
      commandLine: >-
        ansible-playbook update-challenges.yml
      workingDir: /projects/aia-instructor
      label: "Deploy challenges to CTFd"
      group:
        kind: run
        isDefault: false

  - id: full-deploy
    exec:
      component: ansible-tools
      commandLine: >-
        ansible-playbook deploy.yml
      workingDir: /projects/aia-instructor
      label: "Full deployment"
      group:
        kind: run
        isDefault: false

  - id: setup-vault-password
    exec:
      component: ansible-tools
      commandLine: |
        if [ -f .vault-password ]; then
          echo "Vault password file already exists."
        else
          echo "Enter the vault password provided by the event organizer:"
          read -s VAULT_PW
          echo "$VAULT_PW" > .vault-password
          chmod 600 .vault-password
          echo "Vault password saved to .vault-password"
        fi
      workingDir: /projects/aia-instructor
      label: "Setup vault password"
      group:
        kind: build
        isDefault: false

events:
  postStart:
    - setup-ansible-collections
